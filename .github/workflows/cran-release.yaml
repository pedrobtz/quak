# Tags each CRAN submission and opens the development-version bump.
# Commit CRAN-SUBMISSION after `devtools::submit_cran()`; that push is the
# whole release step. Keep CRAN-SUBMISSION in .Rbuildignore, not .gitignore.
on:
  push:
    branches: [main]
    paths: [CRAN-SUBMISSION]
  workflow_dispatch:

name: cran-release.yaml

jobs:
  cran-release:
    uses: pedrobtz/r-actions/.github/workflows/cran-release.yml@3b3d612fc70697ab3b6828d587698390327f1ea2 # v1.29.0
    # Pinned to a commit, not the moving v1 tag: this job holds a token that
    # can push tags and open pull requests.
    permissions:
      contents: write
      pull-requests: write
