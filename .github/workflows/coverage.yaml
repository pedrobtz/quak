on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: coverage.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@9ac7f8ef7258033a7606a5481885fa8426dd324a # v1.27.0
    # Pinned to a commit, not the moving v1 tag: this job holds a token that
    # can push to the repository.
    permissions:
      contents: write
    # The main ruleset requires pull requests, so the badge commit goes to
    # gh-pages, which takes bot pushes (pkgdown deploys there too).
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
